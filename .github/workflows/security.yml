name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.x'

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze with CodeQL
        id: codeql
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/codeql-results

      - name: Reject high-severity source vulnerabilities
        shell: bash
        env:
          SARIF_DIRECTORY: ${{ steps.codeql.outputs.sarif-output }}
        run: |
          shopt -s failglob
          jq --exit-status --slurp '
            if length == 0 then error("Empty CodeQL SARIF") else .[] end
            | if .version != "2.1.0" or (.runs | type) != "array" or (.runs | length) == 0
              then error("Invalid CodeQL SARIF") else .runs[] end
            | ([.tool.driver.rules[]?, .tool.extensions[]?.rules[]?] | INDEX(.id)) as $rules
            | if ($rules | length) == 0 or (.results | type) != "array"
              then error("Missing CodeQL rules or results") else . end
            | [
                .results[] | (.rule.id // .ruleId) as $id
                | $rules[$id] // error("Unknown CodeQL rule: \($id)")
                | (.properties["security-severity"] //
                    if (.properties.tags // [] | index("security")) != null
                    then error("Missing security severity: \(.id)") else "0" end | tonumber) as $severity
                | if $severity < 0 or $severity > 10
                  then error("Invalid security severity: \(.id)") else . end
                | select($severity >= 7) | "\(.id) (\($severity))"
              ]
            | if length > 0 then error("High/Critical CodeQL findings: \(join(", "))") else true end
          ' "${SARIF_DIRECTORY}"/*.sarif
